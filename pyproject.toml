[project]
name = "petrom-dashboard"
version = "0.7.0"  # must match petrom_dashboard.__version__ (a test checks)
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "T201", "LOG", "G"]
